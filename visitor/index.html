<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex,nofollow">
  <meta name="api-base" content="https://red-cake-77d5.evazquez-3e0.workers.dev/">
  <title>EagleNEST Visitor Kiosk</title>
  <meta name="theme-color" content="#0b57d0">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="default">
  <meta name="apple-mobile-web-app-title" content="EagleNEST Visitor">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png">
  <link rel="apple-touch-icon" sizes="192x192" href="../icons/icon-192.png">
  <link rel="stylesheet" href="./visitor.css">
  <script src="./visitor_shared.js" defer></script>
  <script src="./id_scan_adapters.js" defer></script>
  <script src="./visitor.js" defer></script>
</head>
<body>
  <main class="kioskShell">
    <section id="setupScreen" class="screen" hidden>
      <div class="brand">EagleNEST</div>
      <h1>Visitor Kiosk Setup</h1>
      <p class="lead">Enter the pairing code from the Visitor Desk.</p>
      <form id="pairForm" class="setupForm" autocomplete="off">
        <label for="pairCode">Pairing code</label>
        <input id="pairCode" inputmode="numeric" pattern="[0-9]*" maxlength="6" placeholder="000000">
        <label for="kioskLabel">Kiosk name</label>
        <input id="kioskLabel" maxlength="80" value="Front Desk iPad">
        <button class="primary" type="submit">Pair Kiosk</button>
      </form>
      <div id="setupStatus" class="status" aria-live="polite"></div>
    </section>

    <section id="languageScreen" class="screen languageScreen">
      <div class="brand">EagleNEST</div>
      <h1>Visitor Check-In</h1>
      <div class="languageGrid" aria-label="Choose language">
        <button type="button" class="languageBtn" data-lang="en">English</button>
        <button type="button" class="languageBtn" data-lang="es">Español</button>
      </div>
    </section>

    <section id="formScreen" class="screen" hidden>
      <div class="topBar">
        <button id="backBtn" type="button" class="secondary">Back</button>
        <div class="brand small">EagleNEST</div>
      </div>
      <h1 id="formTitle"></h1>
      <p id="formIntro" class="lead"></p>

      <form id="visitorForm" class="visitorForm" autocomplete="off">
        <section class="idPrefillPanel" aria-labelledby="idPrefillToggleBtn">
          <p data-i18n="idPrefillIntro"></p>
          <button id="returningBadgeBtn" type="button" class="secondary returningBadgeBtn" data-i18n="scanPreviousBadge"></button>
          <button id="idPrefillToggleBtn" type="button" class="secondary idPrefillToggle" data-i18n="idPrefillTitle" aria-expanded="false" aria-controls="idPrefillActions stateIdScanPanel"></button>
          <div id="idPrefillActions" class="idPrefillActions" hidden>
            <button id="stateIdPrefillBtn" type="button" class="secondary" data-i18n="stateIdPrefill"></button>
            <button id="idnycPrefillBtn" type="button" class="secondary" data-i18n="idnycPrefill"></button>
            <button id="manualEntryBtn" type="button" data-i18n="manualEntry"></button>
          </div>
          <div id="stateIdScanPanel" class="idScanPanel" data-id-entry-mode="manual" hidden aria-live="polite">
            <div class="idScanTop">
              <div>
                <h3 id="idScanTitle"></h3>
                <p id="idScanInstructions"></p>
              </div>
              <button id="cancelStateIdScanBtn" type="button" data-i18n="cancel"></button>
            </div>
            <div class="idVideoFrame" data-scan-mode="state">
              <video id="idScanVideo" autoplay playsinline muted></video>
              <div id="idScanGuide" class="idScanGuide barcodeGuide" aria-hidden="true"></div>
            </div>
            <div id="idScanStatus" class="scanStatus"></div>
            <div id="returningBadgeActions" class="idScanFallbackActions" hidden>
              <button id="returningCheckoutBtn" type="button" class="primary" data-i18n="returningCheckOut"></button>
              <button id="cancelReturningBadgeBtn" type="button" data-i18n="cancel"></button>
            </div>
            <div id="idScanFallbackActions" class="idScanFallbackActions" hidden>
              <button id="tryAgainIdScanBtn" type="button" class="secondary"></button>
              <button id="idScanPhotoFallbackBtn" type="button" class="secondary"></button>
              <button id="enterManualIdScanBtn" type="button"></button>
            </div>
          </div>
          <input id="idnycCaptureInput" class="visuallyHidden" type="file" accept="image/*" capture="environment">
          <input id="stateIdPhotoInput" class="visuallyHidden" type="file" accept="image/*" capture="environment">
        </section>

        <div id="validationSummary" class="validationSummary" aria-live="polite"></div>

        <div class="grid two">
          <label data-field="visitor_first_name"><span data-i18n="firstName"></span><input name="visitor_first_name" maxlength="80" required><span class="fieldError" data-error-for="visitor_first_name"></span></label>
          <label data-field="visitor_last_name"><span data-i18n="lastName"></span><input name="visitor_last_name" maxlength="100" required><span class="fieldError" data-error-for="visitor_last_name"></span></label>
        </div>
        <label><span data-i18n="middleName"></span><input name="visitor_middle_name" maxlength="80"></label>
        <label data-field="date_of_birth"><span data-i18n="dateOfBirth"></span><input name="date_of_birth" type="date" required><span class="fieldError" data-error-for="date_of_birth"></span></label>
        <label><span data-i18n="organization"></span><input name="organization" maxlength="140"></label>
        <label id="returningOptInWrap" class="returningOptIn" hidden><input name="returning_opt_in" type="checkbox"> <span data-i18n="returningOptIn"></span><small data-i18n="returningOptInHelp"></small></label>

        <fieldset data-field="visitor_type">
          <legend data-i18n="visitorType"></legend>
          <div id="typeChoices" class="choiceGrid" tabindex="-1"></div>
          <div class="fieldError" data-error-for="visitor_type"></div>
        </fieldset>

        <fieldset data-field="purpose">
          <legend data-i18n="purpose"></legend>
          <div id="purposeChoices" class="choiceGrid" tabindex="-1"></div>
          <div class="fieldError" data-error-for="purpose"></div>
        </fieldset>

        <label><span data-i18n="destination"></span><input name="destination" maxlength="160"></label>
        <label><span data-i18n="details"></span><textarea name="notes" maxlength="400" rows="3"></textarea></label>

        <div class="privacy" id="privacyNotice"></div>
        <div id="formStatus" class="status" aria-live="polite"></div>
        <button id="nextPhotoBtn" class="primary submitBtn" type="button"></button>
      </form>
    </section>

    <section id="photoScreen" class="screen" hidden>
      <div class="topBar">
        <button id="photoBackBtn" type="button" class="secondary"></button>
        <div class="brand small">EagleNEST</div>
      </div>
      <h1 id="photoTitle"></h1>
      <p id="photoIntro" class="lead"></p>
      <div class="cameraPanel">
        <div id="cameraFrame" class="cameraFrame" data-photo-state="live">
          <video id="cameraPreview" class="mirrorSelfie" autoplay playsinline muted hidden></video>
          <img id="photoPreview" class="photoReview" alt="" hidden>
          <div id="nativePhotoPrompt" class="nativePhotoPrompt" data-i18n="nativePhotoPrompt"></div>
          <div class="faceGuide" aria-hidden="true"></div>
        </div>
        <input id="visitorPhotoInput" class="visuallyHidden" type="file" accept="image/*" capture="user">
        <div class="cameraActions">
          <button id="takePhotoBtn" class="primary" type="button"></button>
          <button id="retakePhotoBtn" type="button" hidden></button>
          <button id="usePhotoBtn" class="primary" type="button" hidden></button>
        </div>
      </div>
      <div id="photoStatus" class="status" aria-live="polite"></div>
    </section>

    <section id="reviewScreen" class="screen" hidden>
      <div class="topBar">
        <button id="reviewBackBtn" type="button" class="secondary"></button>
        <div class="brand small">EagleNEST</div>
      </div>
      <h1 id="reviewTitle"></h1>
      <p id="reviewIntro" class="lead"></p>
      <div class="reviewGrid">
        <img id="reviewPhoto" alt="" class="reviewPhoto">
        <div id="reviewDetails" class="reviewDetails"></div>
      </div>
      <div id="reviewStatus" class="status" aria-live="polite"></div>
      <button id="submitBtn" class="primary submitBtn" type="button"></button>
    </section>

    <section id="thanksScreen" class="screen thanksScreen" hidden>
      <div class="brand">EagleNEST</div>
      <h1 id="thanksTitle"></h1>
      <p id="thanksMessage" class="lead"></p>
    </section>
  </main>
</body>
</html>
