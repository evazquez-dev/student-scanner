<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width,initial-scale=1" />
  <meta name="robots" content="noindex,nofollow" />
  <meta name="api-base" content="https://red-cake-77d5.evazquez-3e0.workers.dev/" />
  <meta name="google-client-id" content="690302076971-cmclpgcqko4lhuaetbeacu00ptl9jc4m.apps.googleusercontent.com" />
  <script src="https://accounts.google.com/gsi/client" async defer></script>
  <link rel="icon" type="image/png" sizes="32x32" href="../icons/icon-32.png" />
  <link rel="manifest" href="./manifest.webmanifest" />
  <link rel="stylesheet" href="./nav.css" />
  <link rel="stylesheet" href="./calls.css" />
  <script src="./brand.js" defer></script>
  <script src="./nav.js" defer></script>
  <script>(function(){try{var k='ss_theme_v1';var t=localStorage.getItem(k);if(!t)t=(matchMedia&&matchMedia('(prefers-color-scheme: light)').matches)?'light':'dark';document.documentElement.dataset.theme=t}catch(e){}})();</script>
  <title>EagleNEST — Calls</title>
</head>
<body data-module="calls">
  <main class="callsWrap">
    <section id="loginCard" class="panel loginPanel">
      <h1>Staff sign-in</h1><p class="muted">Use your school account to view your EagleNEST call history.</p>
      <div id="g_id_signin"></div><div id="loginOut" class="muted">Loading…</div>
    </section>

    <section id="app" hidden>
      <header class="callsHeader">
        <div><p class="eyebrow">Communications</p><h1>Calls</h1><p id="scopeSummary" class="muted">Loading your call view…</p></div>
        <div class="headerActions"><span id="viewerPill" class="pill">—</span><a class="btn" href="./notifications.html#call-settings">My Settings</a><button id="refreshBtn" class="btn primary" type="button">Refresh</button></div>
      </header>
      <div id="errorBox" class="notice bad" hidden></div>
      <section class="kpiGrid">
        <article class="panel kpi"><span>Total</span><strong id="kpiTotal">0</strong></article>
        <article class="panel kpi"><span>Incoming</span><strong id="kpiIncoming">0</strong></article>
        <article class="panel kpi"><span>Outgoing</span><strong id="kpiOutgoing">0</strong></article>
        <article class="panel kpi"><span>Internal</span><strong id="kpiInternal">0</strong></article>
        <article class="panel kpi"><span>Missed</span><strong id="kpiMissed">0</strong></article>
      </section>
      <section class="panel controls">
        <label>Window<select id="daysSelect" class="control"><option value="1">Today</option><option value="7" selected>Last 7 days</option><option value="14">Last 14 days</option><option value="30">Last 30 days</option></select></label>
        <label class="grow">Search<input id="searchInput" class="control" type="search" placeholder="Student, family contact, extension, campus…" /></label>
      </section>
      <section id="callList" class="callList" aria-live="polite"><div class="panel empty">Loading calls…</div></section>
    </section>
  </main>
  <script src="./calls.js"></script>
</body>
</html>
